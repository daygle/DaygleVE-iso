name: Build ISO

on:
  # Cut an ISO by tagging this repo (e.g. v1.0.0), which should match the
  # DAYGLEVE_VERSION pinned in versions.env.
  push:
    tags: ["v*"]
  # Or build on demand for a chosen version.
  workflow_dispatch:
    inputs:
      version:
        description: "DaygleVE release tag to assemble (overrides versions.env)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          # debian-archive-keyring lets debootstrap verify Debian's Release
          # signature when building a Debian image from an Ubuntu runner.
          # librsvg2-bin (rsvg-convert) lets live-build rasterize the branded
          # boot splash.svg into the splash.png syslinux/grub use as the menu
          # background. A pre-rendered splash.png is also committed as a
          # fallback, so branding survives even if conversion is skipped.
          sudo apt-get install -y xorriso debootstrap curl ca-certificates debian-archive-keyring squashfs-tools librsvg2-bin
          # Install a CURRENT live-build from Debian. The Ubuntu-packaged one is
          # too old for the modern Debian archive: it fetches the obsolete
          # top-level dists/<suite>/Contents-<arch>.gz (removed; now per
          # component), so lb_chroot_linux-image 404s. Pull the latest
          # live-build .deb from Debian's pool and install it (it is
          # Architecture: all - pure shell/make - so it runs fine on Ubuntu).
          LB_DEB=$(curl -fsSL https://deb.debian.org/debian/pool/main/l/live-build/ \
            | grep -oE 'live-build_[^"<]+_all\.deb' | sort -V | tail -1)
          test -n "$LB_DEB"
          echo "Installing Debian live-build: $LB_DEB"
          curl -fsSL -o /tmp/live-build.deb "https://deb.debian.org/debian/pool/main/l/live-build/${LB_DEB}"
          sudo apt-get install -y /tmp/live-build.deb
          # gh is preinstalled on GitHub-hosted runners, but install it
          # explicitly if absent so the workflow is resilient to image changes.
          if ! command -v gh >/dev/null 2>&1; then
            sudo mkdir -p -m 755 /etc/apt/keyrings
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
              | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null
            sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
              | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt-get update
            sudo apt-get install -y gh
          fi

      - name: Build ISO
        env:
          # Token used to download the backend + frontend release assets. The
          # app repos are public, so the built-in GITHUB_TOKEN reads their
          # releases fine and no secret is required. Only set the optional
          # DAYGLEVE_ARTIFACTS_TOKEN secret (a PAT with Contents:read) if you
          # later make those repos private.
          GH_TOKEN: ${{ secrets.DAYGLEVE_ARTIFACTS_TOKEN || secrets.GITHUB_TOKEN }}
          # Version to assemble: an explicit dispatch input wins; otherwise on a
          # tag build use the pushed tag itself (so the ISO always matches the
          # tag it's attached to); otherwise empty -> versions.env's pin. Passed
          # as an env var (never interpolated into the script), validated below.
          DAYGLEVE_VERSION: ${{ inputs.version || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          if [ -n "$DAYGLEVE_VERSION" ]; then
            case "$DAYGLEVE_VERSION" in
              v[0-9]*) ;;
              *) echo "Invalid version input: '$DAYGLEVE_VERSION' (expected a v* tag)" >&2; exit 1 ;;
            esac
          fi
          sudo --preserve-env=GH_TOKEN,DAYGLEVE_VERSION ./build.sh

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: daygleve-iso
          path: "*.iso"
          if-no-files-found: error

      - name: Attach ISO to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: "*.iso"
          generate_release_notes: true
